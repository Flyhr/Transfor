<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfor</title>
<style>
/* ===== Design System（Phase 5C/5D）：Windows 11 + Fluent，统一主题变量 ===== */
:root {
  --font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --spacing-1: 4px; --spacing-2: 8px; --spacing-3: 12px; --spacing-4: 16px; --spacing-5: 24px;
  --shadow-card: 0 2px 8px rgba(0,0,0,.08);
  --transition: 150ms ease;
}
:root[data-theme="light"], :root[data-theme="system"] {
  color-scheme: light;
  --bg: #f3f3f3; --bg-surface: #ffffff; --bg-sidebar: #f9f9f9;
  --text: #1b1b1b; --text-secondary: #6e6e6e;
  --border: #e5e5e5;
  --accent: #0067c0; --accent-hover: #0078d4; --accent-text: #ffffff;
  --danger: #c42b1c;
  --hover: rgba(0,0,0,.05);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #202020; --bg-surface: #2b2b2b; --bg-sidebar: #262626;
  --text: #f3f3f3; --text-secondary: #9d9d9d;
  --border: #3d3d3d;
  --accent: #4cc2ff; --accent-hover: #6fd0ff; --accent-text: #0a0a0a;
  --danger: #ff99a4;
  --hover: rgba(255,255,255,.06);
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] { color-scheme: dark;
    --bg: #202020; --bg-surface: #2b2b2b; --bg-sidebar: #262626;
    --text: #f3f3f3; --text-secondary: #9d9d9d;
    --border: #3d3d3d; --accent: #4cc2ff; --accent-hover: #6fd0ff; --accent-text: #0a0a0a;
    --danger: #ff99a4; --hover: rgba(255,255,255,.06); }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-family); font-size: 14px;
  background: var(--bg); color: var(--text);
  display: flex; overflow: hidden; transition: background var(--transition), color var(--transition);
}

/* ===== 侧边栏 ===== */
.sidebar {
  width: 200px; flex-shrink: 0; background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: var(--spacing-3);
}
.sidebar-brand { font-size: 16px; font-weight: 600; padding: var(--spacing-3) var(--spacing-2) var(--spacing-4); }
.nav-item {
  display: flex; align-items: center; gap: var(--spacing-2);
  padding: var(--spacing-2) var(--spacing-3); border-radius: var(--radius-sm);
  cursor: pointer; color: var(--text); border: none; background: transparent;
  font-size: 14px; text-align: left; transition: background var(--transition);
}
.nav-item:hover { background: var(--hover); }
.nav-item.active { background: var(--hover); font-weight: 600; }
.sidebar-footer { margin-top: auto; padding: var(--spacing-3) var(--spacing-2); font-size: 12px; color: var(--text-secondary); }

/* ===== 内容区 ===== */
.content { flex: 1; overflow-y: auto; padding: var(--spacing-5); }
.page { display: none; max-width: 860px; }
.page.active { display: block; }
.page h1 { font-size: 22px; font-weight: 600; margin-bottom: var(--spacing-2); }
.page .placeholder { color: var(--text-secondary); margin-bottom: var(--spacing-5); }

/* ===== 组件 ===== */
.card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-card);
  padding: var(--spacing-4); margin-bottom: var(--spacing-4);
}
.card h3 { font-size: 15px; margin-bottom: var(--spacing-3); }
.btn {
  font-family: inherit; font-size: 14px; padding: 6px 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-surface); color: var(--text); cursor: pointer;
  transition: background var(--transition), border-color var(--transition);
}
.btn:hover { background: var(--hover); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.input {
  font-family: inherit; font-size: 14px; padding: 6px 10px;
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-surface); color: var(--text); outline: none;
}
.input:focus { border-color: var(--accent); }
.progress { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width var(--transition); }
.row { display: flex; align-items: center; gap: var(--spacing-3); margin-bottom: var(--spacing-3); }
.row .label { width: 110px; color: var(--text-secondary); }

/* ===== Toast ===== */
.toast-container { position: fixed; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
.toast {
  background: var(--bg-surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm); padding: 10px 14px; min-width: 200px; box-shadow: var(--shadow-card);
  animation: toast-in 200ms ease;
}
.toast.error { border-left-color: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ===== 对话框 ===== */
.dialog-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
  align-items: center; justify-content: center; z-index: 999;
}
.dialog-backdrop.open { display: flex; }
.dialog {
  background: var(--bg-surface); border-radius: var(--radius-lg);
  padding: var(--spacing-5); min-width: 360px; box-shadow: var(--shadow-card);
}
.dialog h3 { margin-bottom: var(--spacing-3); }
.dialog .dialog-actions { display: flex; justify-content: flex-end; gap: var(--spacing-2); margin-top: var(--spacing-4); }
</style>
</head>
<body>

  <div class="sidebar-brand">Transfor</div>
  <button class="nav-item active" data-page="home">首页</button>
  <button class="nav-item" data-page="media">媒体下载</button>
  <button class="nav-item" data-page="downloads">下载</button>
  <button class="nav-item" data-page="browser">浏览器</button>
  <button class="nav-item" data-page="history">历史</button>
  <button class="nav-item" data-page="settings">设置</button>
  <div class="sidebar-footer">
    <div id="app-version">版本 …</div>
    <div style="margin-top:6px">
      <button class="btn" id="theme-toggle" title="切换主题" style="font-size:12px;padding:3px 10px">主题：跟随系统</button>
    </div>
  </div>
</div>

<div class="content">
  <section class="page active" id="page-home">
    <h1>首页</h1>
    <p class="placeholder">快捷操作、最近记录、版本与更新状态（Phase 6 迁移）。</p>
    <div class="card">
      <h3>设计系统组件预览（Phase 5 验收）</h3>
      <div class="row"><span class="label">按钮</span>
        <button class="btn" id="demo-toast">普通按钮</button>
        <button class="btn btn-primary" id="demo-dialog">主按钮</button>
        <button class="btn" id="demo-progress">进度演示</button>
      </div>
      <div class="row"><span class="label">输入框</span><input class="input" placeholder="输入框演示" style="flex:1"></div>
      <div class="row"><span class="label">进度条</span>
        <div class="progress" style="flex:1"><div id="demo-progress-bar" style="width:35%"></div></div>
      </div>
    </div>
  </section>

  <section class="page" id="page-media">
    <h1>媒体下载</h1>
    <div class="card">
      <div class="row" style="margin-bottom:0">
        <input class="input" id="media-link" placeholder="粘贴抖音分享链接或直接图片/视频链接" style="flex:1">
        <button class="btn" id="media-paste">粘贴</button>
        <button class="btn btn-primary" id="media-resolve">解析</button>
      </div>
      <div id="media-status" style="color:var(--text-secondary);margin-top:8px"></div>
    </div>
    <div id="media-post" style="display:none">
      <div class="card">
        <h3 id="media-title">作品</h3>
        <div id="media-author" style="color:var(--text-secondary);margin-bottom:8px"></div>
        <div class="row" style="margin-bottom:0">
          <label class="checkbox-label" style="display:flex;align-items:center;gap:6px;cursor:pointer">
            <input type="checkbox" id="media-select-all"> 全选
          </label>
          <button class="btn btn-primary" id="media-download">下载选中</button>

  <section class="page" id="page-downloads">

    <div class="row" style="margin-bottom:12px">
      <span id="downloads-summary" style="color:var(--text-secondary)"></span>
      <button class="btn" id="downloads-cancel-all" style="margin-left:auto">全部取消</button>
    </div>
    <p class="placeholder" id="downloads-empty">暂无下载任务。</p>
    <div id="downloads-list" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>
  <section class="page" id="page-browser"><h1>浏览器</h1><p class="placeholder">内置浏览器（Phase 6.5 迁移）。</p></section>
  <section class="page" id="page-history">
    <h1>历史</h1>
    <div class="card">
      <div class="row" style="margin-bottom:0">
        <input class="input" id="history-search" placeholder="搜索标题/原文/作者/链接…" style="flex:1">
        <button class="btn" id="history-refresh">刷新</button>
      </div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:4px">
        <h3 style="margin:0">文本转换</h3>
        <button class="btn" id="history-clear-text" style="margin-left:auto;padding:4px 10px;font-size:12px">清空全部文本历史</button>
      </div>
      <div id="history-quote"></div>
      <div id="history-space"></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:4px">
        <h3 style="margin:0">媒体下载</h3>
        <button class="btn" id="history-clear-media" style="margin-left:auto;padding:4px 10px;font-size:12px">清空媒体历史</button>
      </div>
      <div id="history-media"></div>
    </div>
  </section>

  <section class="page" id="page-settings">
    <h1>设置</h1>
    <p class="placeholder">常规/下载/浏览器/更新/外观/快捷键（Phase 6.6 迁移）。</p>
    <div class="card">
      <h3>更新通道（经 App Bridge 读写真实设置）</h3>
      <div class="row">
        <span class="label">更新通道</span>
        <select class="input" id="setting-channel" style="padding:5px">
          <option value="stable">Stable 稳定版</option>
          <option value="beta">Beta 测试版</option>
        </select>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="setting-save">保存设置</button>
        <button class="btn" id="setting-check-update">检查更新</button>
        <span id="setting-result" style="color:var(--text-secondary)"></span>
      </div>
    </div>
  </section>
</div>

<div class="toast-container" id="toast-container"></div>
<div class="dialog-backdrop" id="dialog-backdrop">
  <div class="dialog">
    <h3>演示对话框</h3>
    <p>对话框组件（Design System 之一）。</p>
    <div class="dialog-actions">
      <button class="btn" id="dialog-cancel">取消</button>
      <button class="btn btn-primary" id="dialog-ok">确定</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===== App Bridge（Phase 5B/6M1）：JSON 消息协议 + 事件订阅 ===== */
const Bridge = (() => {
  let nextId = 1;
  const pending = new Map();
  const listeners = new Map();
  const webview = window.chrome.webview;

  function invoke(method, params = {}) {
    return new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      webview.postMessage(JSON.stringify({ id, method, params }));
      setTimeout(() => { if (pending.delete(id)) reject(new Error("调用超时")); }, 15000);
    });
  }

  // 订阅 C# 推送事件（如 downloadProgress / taskCompleted / batchCompleted）
  function on(eventName, callback) {
    if (!listeners.has(eventName)) listeners.set(eventName, []);
    listeners.get(eventName).push(callback);
  }

  webview.addEventListener("message", (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.event) {
      const cbs = listeners.get(msg.event);
      if (cbs) cbs.forEach((cb) => { try { cb(msg.data); } catch (err) { console.error(err); } });
      return;
    }
    if (msg.id !== undefined && msg.id !== null) {
      const entry = pending.get(msg.id);
      if (!entry) return;
      pending.delete(msg.id);
      if (msg.error !== undefined && msg.error !== null) entry.reject(new Error(msg.error));
      else entry.resolve(msg.result);
    }
  });

  return { invoke, on };
})();

/* ===== 主题（Phase 5D）：跟随系统 + 手动切换 ===== */
const THEMES = ["system", "light", "dark"];
const THEME_LABELS = { system: "跟随系统", light: "浅色", dark: "深色" };
let currentTheme = "system";
const themeToggle = document.getElementById("theme-toggle");
function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.dataset.theme = theme;
  themeToggle.textContent = "主题：" + THEME_LABELS[theme];
}
themeToggle.addEventListener("click", () => {
  applyTheme(THEMES[(THEMES.indexOf(currentTheme) + 1) % THEMES.length]);
});

/* ===== 导航 ===== */
document.querySelectorAll(".nav-item").forEach((item) => {
  item.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach((n) => n.classList.remove("active"));
    document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
    item.classList.add("active");
    document.getElementById("page-" + item.dataset.page).classList.add("active");
    // 下载页激活时拉取最新任务快照；历史页激活时加载历史
    if (item.dataset.page === "downloads") refreshDownloads();
    if (item.dataset.page === "history") loadHistory();
  });
});

/* ===== Toast ===== */
function toast(message, type = "") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = message;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* ===== 对话框 ===== */
const backdrop = document.getElementById("dialog-backdrop");
document.getElementById("demo-dialog").addEventListener("click", () => backdrop.classList.add("open"));
document.getElementById("dialog-cancel").addEventListener("click", () => backdrop.classList.remove("open"));
document.getElementById("dialog-ok").addEventListener("click", () => { backdrop.classList.remove("open"); toast("已确定"); });

/* ===== 演示 ===== */
document.getElementById("demo-toast").addEventListener("click", () => toast("Toast 组件演示"));
let progressValue = 35;
document.getElementById("demo-progress").addEventListener("click", () => {
  progressValue = progressValue >= 100 ? 0 : progressValue + 15;
  document.getElementById("demo-progress-bar").style.width = progressValue + "%";
  if (progressValue >= 100) toast("进度完成");
});

/* ===== 媒体下载页（Phase 6.2） ===== */
const mediaLink = document.getElementById("media-link");
const mediaStatus = document.getElementById("media-status");
const mediaPost = document.getElementById("media-post");
const mediaGrid = document.getElementById("media-grid");
let currentShareLink = null;
let currentAssets = [];

const roleLabels = { livephotostill: "图片 LIVE", livephotomotion: "视频 LIVE" };
function assetTypeLabel(asset) {
  if (asset.role === "livephotostill" || asset.role === "livephotomotion") return roleLabels[asset.role];
  return asset.kind === "image" ? "图片" : "视频";
}

document.getElementById("media-paste").addEventListener("click", async () => {
  try {
    const { text } = await Bridge.invoke("getClipboardText");
    if (text) { mediaLink.value = text.trim(); mediaStatus.textContent = "已粘贴剪贴板内容。"; }
    else mediaStatus.textContent = "剪贴板为空。";
  } catch (e) { mediaStatus.textContent = "读取剪贴板失败：" + e.message; }
});

const resolveButton = document.getElementById("media-resolve");
const downloadButton = document.getElementById("media-download");
const downloadStatus = document.getElementById("media-download-status");
let activeBatch = null; // { batchId, total, done }

document.getElementById("media-resolve").addEventListener("click", async () => {
  const link = mediaLink.value.trim();
  if (!link) { mediaStatus.textContent = "请输入链接。"; return; }
  // 解析开始时清空旧作品（失败/交互也不保留，防止误下载旧作品）
  resetMediaView();
  resolveButton.disabled = true;
  mediaStatus.textContent = "解析中…";
  try {
    const result = await Bridge.invoke("resolveMedia", { link });
    if (result.status === "succeeded") {
      renderPost(result.post);
      mediaStatus.textContent = `解析成功：${result.post.assets.length} 个媒体。`;
    } else if (result.status === "requiresInteraction") {
      mediaStatus.textContent = result.message || "需要浏览器登录后继续解析。";
    } else {
      mediaStatus.textContent = result.message || "解析失败。";
    }
  } catch (e) { mediaStatus.textContent = "解析失败：" + e.message; }
  finally { resolveButton.disabled = false; }
});

function resetMediaView() {
  currentShareLink = null;
  currentAssets = [];
  mediaPost.style.display = "none";
  mediaGrid.innerHTML = "";
  document.getElementById("media-select-all").checked = false;
  downloadStatus.textContent = "";
  activeBatch = null;
}

function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return "";
  if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
  return (bytes / 1024).toFixed(0) + " KB";
}

function renderPost(post) {
  currentShareLink = mediaLink.value.trim();
  currentAssets = post.assets;
  document.getElementById("media-title").textContent = post.title || "未命名作品";
  document.getElementById("media-author").textContent = post.authorName ? "作者：" + post.authorName : "";
  mediaGrid.innerHTML = "";
  post.assets.forEach((asset) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.cssText = "padding:10px;margin:0;display:flex;flex-direction:column;gap:8px";
    const thumb = document.createElement("div");
    thumb.style.cssText = "height:110px;background:var(--hover);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:12px;overflow:hidden";
    const canPreview = asset.kind === "image" && asset.status === "Selected";
    thumb.textContent = canPreview ? "点击预览" : (asset.status !== "Selected" ? (asset.message || "不可下载") : (asset.kind === "video" ? "视频" : "图片"));
    if (canPreview) {
      thumb.style.cursor = "pointer";
      thumb.addEventListener("click", async () => {
        thumb.textContent = "加载中…";
        try {
          const { dataUrl } = await Bridge.invoke("getPreview", { assetIndex: asset.index });
          thumb.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:contain">`;
        } catch (e) { thumb.textContent = "预览失败"; }
      });
    }
    const info = document.createElement("div");
    info.style.cssText = "display:flex;flex-direction:column;gap:2px;font-size:12px";
    const sizeText = asset.contentLength ? ` · ${formatBytes(asset.contentLength)}` : "";
    info.innerHTML = `<div>${assetTypeLabel(asset)}${asset.width && asset.height ? ` · ${asset.width}×${asset.height}` : ""}${sizeText}</div>`;
    const checkRow = document.createElement("label");
    checkRow.style.cssText = "display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = asset.status === "Selected";
    checkbox.disabled = asset.status !== "Selected";
    checkRow.appendChild(checkbox);
    checkRow.appendChild(document.createTextNode("下载"));
    info.appendChild(checkRow);
    card.appendChild(thumb);
    card.appendChild(info);
    mediaGrid.appendChild(card);
  });
  mediaPost.style.display = "block";
}

document.getElementById("media-select-all").addEventListener("change", (e) => {
  mediaGrid.querySelectorAll("input[type=checkbox]").forEach((cb) => { cb.checked = e.target.checked && !cb.disabled; });
});

document.getElementById("media-download").addEventListener("click", async () => {
  if (!currentShareLink) return;
  const indexes = [];
  mediaGrid.querySelectorAll(".card").forEach((card, i) => {
    const cb = card.querySelector("input[type=checkbox]");
    if (cb && cb.checked && !cb.disabled) indexes.push(i);
  });
  if (indexes.length === 0) { downloadStatus.textContent = "请先勾选要下载的媒体。"; return; }
  downloadButton.disabled = true;
  try {
    const { accepted, batchId } = await Bridge.invoke("downloadSelected", { shareLink: currentShareLink, assets: indexes });
    activeBatch = { batchId, total: accepted, done: 0 };
    downloadStatus.textContent = `已加入下载队列：${accepted} 个媒体（下载中 0/${accepted}）。`;
    toast(`已加入下载队列：${accepted} 个媒体`);
  } catch (e) { downloadStatus.textContent = "下载失败：" + e.message; }
  finally { downloadButton.disabled = false; }
});

/* ===== 下载事件（Phase 6 M1 推送） ===== */
Bridge.on("taskCompleted", (data) => {
  if (activeBatch && data.batchId === activeBatch.batchId) {
    activeBatch.done += 1;
    const statusLabel = data.status === "succeeded" ? "完成" : (data.status === "cancelled" ? "已取消" : "失败");
    downloadStatus.textContent = `${statusLabel} ${activeBatch.done}/${activeBatch.total}。`;
    if (activeBatch.done >= activeBatch.total) activeBatch = null;
  }
});
Bridge.on("batchCompleted", () => {
  if (activeBatch) { downloadStatus.textContent = "本批次下载已全部落定。"; activeBatch = null; }
});

/* ===== 下载管理页（Phase 6.3） ===== */
const downloadsList = document.getElementById("downloads-list");
const downloadsEmpty = document.getElementById("downloads-empty");
const downloadsSummary = document.getElementById("downloads-summary");
const downloadTasks = new Map();   // taskId -> 任务视图对象
const taskTimestamps = new Map();  // taskId -> { bytes, time }（速度计算）

const phaseLabels = { pending: "等待中", downloading: "下载中", completed: "已结束" };
const statusLabels = { succeeded: "已完成", failed: "失败", cancelled: "已取消" };

function refreshDownloads() {
  return Bridge.invoke("getDownloads").then((tasks) => {
    downloadTasks.clear();
    taskTimestamps.clear();
    tasks.forEach((t) => downloadTasks.set(t.taskId, { ...t, speed: null }));
    renderDownloads();
  }).catch((e) => { downloadsSummary.textContent = "加载失败：" + e.message; });
}

function renderDownloads() {
  downloadsEmpty.style.display = downloadTasks.size === 0 ? "block" : "none";
  downloadsList.style.display = downloadTasks.size === 0 ? "none" : "flex";
  const active = [...downloadTasks.values()].filter((t) => t.phase !== "completed").length;
  downloadsSummary.textContent = downloadTasks.size === 0 ? "" : `任务 ${downloadTasks.size} 个，进行中 ${active} 个`;
  downloadsList.innerHTML = "";
  downloadTasks.forEach((t) => downloadsList.appendChild(buildTaskRow(t)));
}

function buildTaskRow(t) {
  const row = document.createElement("div");
  row.className = "card";
  row.dataset.taskId = t.taskId;
  row.style.cssText = "padding:12px;margin:0;display:flex;flex-direction:column;gap:8px";

  const head = document.createElement("div");
  head.style.cssText = "display:flex;align-items:center;gap:10px";
  const name = document.createElement("span");
  name.style.cssText = "flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
  name.textContent = decodePath(t.targetPath);
  const status = document.createElement("span");
  status.className = "task-status";
  status.style.cssText = "font-size:12px;color:var(--text-secondary)";
  head.appendChild(name);
  head.appendChild(status);
  row.appendChild(head);

  const progressWrap = document.createElement("div");
  progressWrap.style.cssText = "display:flex;align-items:center;gap:8px";
  const bar = document.createElement("div");
  bar.className = "progress";
  bar.style.cssText = "flex:1";
  const fill = document.createElement("div");
  fill.style.width = "0%";
  bar.appendChild(fill);
  const meta = document.createElement("span");
  meta.style.cssText = "font-size:12px;color:var(--text-secondary);min-width:150px;text-align:right";
  progressWrap.appendChild(bar);
  progressWrap.appendChild(meta);
  row.appendChild(progressWrap);

  const actions = document.createElement("div");
  actions.style.cssText = "display:flex;gap:6px;justify-content:flex-end";
  row.appendChild(actions);

  updateTaskRow(row, t);
  return row;
}

function updateTaskRow(row, t) {
  const taskId = row.dataset.taskId;
  const statusEl = row.querySelector(".task-status");
  const fill = row.querySelector(".progress > div");
  const meta = row.querySelector("span:last-child");
  const actions = row.lastChild;
  if (!statusEl || !fill || !meta) return;

  if (t.phase === "completed") {
    statusEl.textContent = statusLabels[t.status] || t.status;
    fill.style.width = "100%";
    meta.textContent = t.status === "succeeded" ? "已完成" : (t.error ? "失败：" + t.error : "已取消");
  } else {
    statusEl.textContent = phaseLabels[t.phase] || t.phase;
    const percent = t.percent != null ? Math.min(100, t.percent) : 0;
    fill.style.width = percent + "%";
    const speedText = t.speed != null ? " · " + formatSpeed(t.speed) : "";
    meta.textContent = (t.totalBytes ? formatBytes(t.bytesDownloaded) + " / " + formatBytes(t.totalBytes) : formatBytes(t.bytesDownloaded)) + speedText;
  }

  actions.innerHTML = "";
  if (t.phase !== "completed") {
    addAction(actions, "取消", () => Bridge.invoke("cancelTask", { taskId }).then(() => toast("已取消任务")).catch((e) => toast(e.message, "error")));
  } else if (t.status === "failed" || t.status === "cancelled") {
    addAction(actions, "重试", () => Bridge.invoke("retryTask", { taskId }).then(() => { toast("已重新加入队列"); return refreshDownloads(); }).catch((e) => toast(e.message, "error")));
  }
  if (t.status === "succeeded" && t.savedPath) {
    addAction(actions, "打开文件", () => Bridge.invoke("openFile", { path: t.savedPath }).catch((e) => toast(e.message, "error")));
    addAction(actions, "打开文件夹", () => Bridge.invoke("openFolder", { path: t.savedPath }).catch((e) => toast(e.message, "error")));
  }
}

function addAction(container, label, handler) {
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = label;
  btn.style.cssText = "padding:4px 10px;font-size:12px";
  btn.addEventListener("click", handler);
  container.appendChild(btn);
}

function formatSpeed(bytesPerSecond) {
  if (bytesPerSecond >= 1024 * 1024) return (bytesPerSecond / 1024 / 1024).toFixed(1) + " MB/s";
  if (bytesPerSecond >= 1024) return (bytesPerSecond / 1024).toFixed(0) + " KB/s";
  return bytesPerSecond + " B/s";
}

function decodePath(path) {
  try {
    return decodeURIComponent(path.replace(/\\/g, "/").split("/").pop() || path);
  } catch { return path; }
}

// 下载事件：增量更新（进度节流渲染；完成/批次落定刷新）
let progressThrottle = 0;
Bridge.on("downloadProgress", (data) => {
  const t = downloadTasks.get(data.taskId);
  if (!t) return;
  const now = Date.now();
  const prev = taskTimestamps.get(data.taskId);
  if (prev && now - prev.time >= 1000) {
    t.speed = (data.bytesDownloaded - prev.bytes) / ((now - prev.time) / 1000);
  }
  taskTimestamps.set(data.taskId, { bytes: data.bytesDownloaded, time: now });
  t.bytesDownloaded = data.bytesDownloaded;
  t.totalBytes = data.totalBytes;
  t.percent = data.percent;
  if (now - progressThrottle > 300) {
    progressThrottle = now;
    const row = downloadsList.querySelector(`[data-task-id="${data.taskId}"]`);
    if (row) updateTaskRow(row, t);
  }
});
Bridge.on("taskCompleted", (data) => {
  const t = downloadTasks.get(data.taskId);
  if (t) {
    t.phase = "completed";
    t.status = data.status;
    t.savedPath = data.savedPath;
    t.error = data.error;
    const row = downloadsList.querySelector(`[data-task-id="${data.taskId}"]`);
    if (row) updateTaskRow(row, t);
    toast(statusLabels[data.status] || data.status + "：" + (data.savedPath || ""));
  }
});
Bridge.on("batchCompleted", () => refreshDownloads());

document.getElementById("downloads-cancel-all").addEventListener("click", () => {
  Bridge.invoke("cancelAllDownloads").then(() => toast("已请求取消全部任务")).catch((e) => toast(e.message, "error"));
});

/* ===== 历史页（Phase 6.4） ===== */
let historyData = { text: { quote: [], space: [] }, media: [] };
let historyFilter = "";

function loadHistory() {
  return Bridge.invoke("getHistory").then((data) => {
    historyData = data;
    renderHistory();
  }).catch((e) => toast("历史加载失败：" + e.message, "error"));
}

function renderHistory() {
  const filter = historyFilter.toLowerCase();
  const textMatches = (h) => !filter || h.input.toLowerCase().includes(filter) || h.output.toLowerCase().includes(filter);
  renderTextGroup("history-quote", historyData.text.quote, "引号转换", textMatches);
  renderTextGroup("history-space", historyData.text.space, "去除空格", textMatches);
  renderMediaGroup(historyData.media, filter);
}

function renderTextGroup(containerId, entries, label, filterFn) {
  const container = document.getElementById(containerId);
  const visible = entries.filter(filterFn);
  if (visible.length === 0) {
    container.innerHTML = `<div style="color:var(--text-secondary);font-size:12px;padding:6px 0">${label}：暂无记录。</div>`;
    return;
  }
  container.innerHTML = `<div style="color:var(--text-secondary);font-size:12px;margin-bottom:4px">${label}（${visible.length} 条）</div>`;
  visible.forEach((h, index) => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)";
    const text = document.createElement("span");
    text.style.cssText = "flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
    text.textContent = h.input + " → " + h.output;
    text.title = text.textContent;
    const del = document.createElement("button");
    del.className = "btn";
    del.textContent = "删除";
    del.style.cssText = "padding:2px 8px;font-size:12px";
    del.addEventListener("click", () => deleteTextEntry(label === "引号转换" ? "quote" : "space", index));
    row.appendChild(text);
    row.appendChild(del);
    container.appendChild(row);
  });
}

function renderMediaGroup(entries, filter) {
  const container = document.getElementById("history-media");
  const visible = entries.filter((h) => !filter || (h.title && h.title.toLowerCase().includes(filter)) || h.sourceShareLink.toLowerCase().includes(filter));
  if (visible.length === 0) {
    container.innerHTML = `<div style="color:var(--text-secondary);font-size:12px;padding:6px 0">暂无记录。</div>`;
    return;
  }
  container.innerHTML = `<div style="color:var(--text-secondary);font-size:12px;margin-bottom:4px">共 ${visible.length} 条</div>`;
  visible.forEach((h, index) => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)";
    const text = document.createElement("span");
    text.style.cssText = "flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
    text.textContent = `${h.title || "未命名作品"}（成功 ${h.successCount} / 失败 ${h.failureCount} / 取消 ${h.cancelledCount}）`;
    text.title = h.sourceShareLink;
    const redo = document.createElement("button");
    redo.className = "btn";
    redo.textContent = "重新执行";
    redo.style.cssText = "padding:2px 8px;font-size:12px";
    redo.addEventListener("click", () => reparseShareLink(h.sourceShareLink));
    const del = document.createElement("button");
    del.className = "btn";
    del.textContent = "删除";
    del.style.cssText = "padding:2px 8px;font-size:12px";
    del.addEventListener("click", () => deleteMediaEntry(index));
    row.appendChild(text);
    row.appendChild(redo);
    row.appendChild(del);
    container.appendChild(row);
  });
}

function deleteTextEntry(tool, index) {
  Bridge.invoke("deleteHistoryEntry", { type: "text", tool, index })
    .then(() => { toast("已删除"); return loadHistory(); })
    .catch((e) => toast(e.message, "error"));
}

function deleteMediaEntry(index) {
  Bridge.invoke("deleteHistoryEntry", { type: "media", index })
    .then(() => { toast("已删除"); return loadHistory(); })
    .catch((e) => toast(e.message, "error"));
}

// 重新执行：切到媒体页并解析该链接
function reparseShareLink(link) {
  const mediaNav = document.querySelector('.nav-item[data-page="media"]');
  if (mediaNav) mediaNav.click();
  mediaLink.value = link;
  document.getElementById("media-resolve").click();
}

document.getElementById("history-refresh").addEventListener("click", () => loadHistory());
document.getElementById("history-search").addEventListener("input", (e) => {
  historyFilter = e.target.value.trim();
  renderHistory();
});
document.getElementById("history-clear-text").addEventListener("click", async () => {
  try {
    await Bridge.invoke("clearHistory", { type: "text", tool: "quote" });
    await Bridge.invoke("clearHistory", { type: "text", tool: "space" });
    toast("文本历史已清空");
    loadHistory();
  } catch (e) { toast(e.message, "error"); }
});
document.getElementById("history-clear-media").addEventListener("click", () => {
  Bridge.invoke("clearHistory", { type: "media" })
    .then(() => { toast("媒体历史已清空"); return loadHistory(); })
    .catch((e) => toast(e.message, "error"));
});

/* ===== 设置页（真实 Bridge 调用） ===== */
const channelSelect = document.getElementById("setting-channel");
const settingResult = document.getElementById("setting-result");

document.getElementById("setting-save").addEventListener("click", async () => {
  try {
    const settings = await Bridge.invoke("saveSettings", { updateChannel: channelSelect.value });
    channelSelect.value = settings.updateChannel;
    toast("设置已保存");
  } catch (e) { toast(e.message, "error"); }
});

document.getElementById("setting-check-update").addEventListener("click", async () => {
  settingResult.textContent = "检查中…";
  try {
    const info = await Bridge.invoke("checkUpdate");
    const labels = { upToDate: "已是最新版本", optionalUpdate: "发现新版本", requiredUpdate: "需要强制更新", checkFailed: "检查失败", disabled: "更新已禁用" };
    settingResult.textContent = labels[info.status] || info.status;
  } catch (e) { settingResult.textContent = "检查失败：" + e.message; }
});

/* ===== 初始化 ===== */
(async () => {
  try {
    const info = await Bridge.invoke("getAppInfo");
    document.getElementById("app-version").textContent = "Transfor v" + info.version + " · " + (info.channel === "beta" ? "Beta" : "Stable");
    const settings = await Bridge.invoke("getSettings");
    channelSelect.value = settings.updateChannel;
  } catch (e) {
    document.getElementById("app-version").textContent = "Bridge 不可用：" + e.message;
  }
})();
</script>
